<main class="page-wrapper">
    <section class="hero">
        <h1>IMS Phone Subscriber Service</h1>
    </section>

    <section class="grid">
        <div class="card">
            <h2>Add / Update Subscriber</h2>

            <form id="subscriberForm">
                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="text" id="phoneNumber" placeholder="Example: 09171234567" required />
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Example: john007" required />
                </div>

                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required />
                </div>

                <div class="show-password-option">
                    <input type="checkbox" id="showPassword" />
                    <label for="showPassword">Show password</label>
                </div>

                <div class="form-group">
                    <label for="domain">Domain</label>
                    <input type="text" id="domain" placeholder="Example: ims.local" required />
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="SUSPENDED">SUSPENDED</option>
                    </select>
                </div>

                <label>Subscriber Features</label>
                <div class="feature-box">
                    <div class="form-group feature-field">
                        <label>Call Forward No Reply</label>
                        <div class="toggle-group">
                            <span class="toggle-text">Enabled</span>
                            <label class="toggle-switch" for="callForwardNoReply">
                                <input type="checkbox" id="callForwardNoReply" />
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group feature-field">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" placeholder="Example: tel:+11111111" />
                    </div>
                </div>

                <div class="button-row">
                    <button type="submit" class="btn-save">Save Subscriber</button>
                    <button type="button" class="btn-clear" onclick="clearForm()">Clear Form</button>
                </div>
            </form>

            <div id="formMessage" class="status-message"></div>
        </div>

        <div class="card">
            <h2>Search / Delete Subscriber</h2>

            <div class="search-box">
                <input type="text" id="searchPhoneNumber" placeholder="Enter phone number" />
                <button class="btn-get" onclick="getSubscriber()">Search</button>
            </div>

            <div class="button-row">
                <button class="btn-danger" onclick="deleteSubscriber()">Delete Subscriber</button>
            </div>
            <br>
            <label for="result">Result</label>
            <div id="result" class="result-card">
                Search result will appear here.
            </div>

            <div id="actionMessage" class="status-message"></div>
        </div>
    </section>

    <div id="deleteConfirmModal" class="custom-modal hidden">
        <div class="custom-modal-overlay"></div>

        <div class="custom-modal-content">
            <h3>Confirm Deletion</h3>
            <p id="deleteModalMessage">
                Are you sure you want to delete this subscriber?<br>
                This action cannot be undone.
            </p>

            <div class="custom-modal-actions">
                <button type="button" id="confirmDeleteBtn" class="modal-btn modal-btn-danger">
                    Yes, Delete
                </button>

                <button type="button" id="cancelDeleteBtn" class="modal-btn modal-btn-secondary">
                    No, Keep It
                </button>
            </div>
        </div>
    </div>
</main>
